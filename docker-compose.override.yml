# Untracked override for local multi-stack e2e (Champ Suite).
# Host-port remap: backend 8000 -> 8010. Do not commit.
services:
  backend:
    ports: !override
      - "8010:8000"
  # frontend's default host port 3000 collides with Harbinger's app in this
  # multi-stack local setup; e2e only needs the backend API, but remap rather
  # than drop the service so the container still starts cleanly.
  frontend:
    ports: !override
      - "3010:80"
  # mail-engine image has no curl; tracked healthcheck can never pass.
  # Use busybox wget (present in image) instead.
  mail-engine:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/health"]
      interval: 30s
      timeout: 10s
      retries: 3
