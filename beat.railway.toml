# Railway configuration for the ChampMail Celery BEAT scheduler.
#
# Beat is what makes the recurring work in app/celery_app.py:41 actually happen:
#
#   every 5 min   app.tasks.sequences.execute_pending_steps
#   09:00 daily   app.tasks.warmup.execute_warmup_sends
#   every 6 h     app.tasks.domains.check_all_domain_health
#   every 10 min  app.tasks.bounces.process_bounce_queue
#   23:55 daily   app.tasks.analytics.aggregate_daily_stats
#
# Without it, sequence steps never fire, warmup never runs, bounces never get
# processed and daily stats never aggregate. The worker alone is not enough —
# it only drains what something else enqueues.
#
# Deploy as a SEPARATE Railway service from the same repo:
#   Root Directory : backend
#   Config Path    : ../beat.railway.toml   (or copy this into backend/)
#
# ! Run exactly ONE beat replica. Beat is a scheduler, not a worker: two
# ! replicas double-fire every scheduled task, which for warmup means double
# ! the send volume against the same mailboxes. Leave replicas at 1 and scale
# ! the worker service instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A app.celery_app beat --loglevel=info"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[env]
# Beat only needs to reach the broker and the DB to compute its schedule:
#   DATABASE_URL
#   REDIS_URL
#   ENVIRONMENT=production
#
# It enqueues rather than executes, so it does NOT need EMAIL_ENCRYPTION_KEY or
# the InboxKit credentials — those belong to the worker.
