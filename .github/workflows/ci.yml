name: CI

on:
  push:
    branches: [main, v2-consolidation, production-email-engine, simplified]
  pull_request:
    branches: [main, production-email-engine, v2-consolidation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + import smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # The suite is offline by contract: no DB, no Redis, no SMTP, no network.
      # conftest.py points DATABASE_URL/REDIS_URL at localhost so any accidental
      # live connection fails fast rather than silently succeeding.
      - name: Import every module
        run: python import_smoke.py

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b` runs first as part of the build script, so a type error fails
      # here rather than producing a broken bundle.
      - name: Typecheck and build
        run: npm run build

  mail-engine:
    name: Mail engine (go build/vet/test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mail-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: mail-engine/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Covers the DKIM signer and MIME builder tests added by PR #1.
      - name: Test
        run: go test ./...

  migrations:
    name: Migrations (single alembic head)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The three lineages (pee, PR #1-4, PR #5) each shipped their own
      # 009..015 numbering, which produced multiple alembic heads. This gate
      # fails if that ever happens again.
      - name: Assert exactly one migration head
        env:
          DATABASE_URL: postgresql+asyncpg://unused:unused@localhost:5432/unused
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "heads: $heads"
          test "$heads" -eq 1