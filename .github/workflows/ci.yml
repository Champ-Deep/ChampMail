name: ci

# Push-only on purpose: this branch is never PR'd (no pull_request trigger).
on:
  push:
    branches: [v3-infra]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: cm, POSTGRES_PASSWORD: pw, POSTGRES_DB: cm_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cm" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=a1:pw@x.test,a2:pw@x.test,a3:pw@x.test,locked:realpw@x.test
        ports: ["3025:3025", "3143:3143", "8080:8080"]
      mailpit:
        image: axllent/mailpit:latest
        env: {MP_SMTP_AUTH_ACCEPT_ANY: "true", MP_SMTP_AUTH_ALLOW_INSECURE: "true"}
        ports: ["1025:1025", "8025:8025"]
    env:
      # Same shape as a real stack's .env: keys present, so the env-isolation tests run against them.
      TEST_DATABASE_URL: postgresql+psycopg://cm:pw@127.0.0.1:5432/cm_test
      DATABASE_URL: postgresql+psycopg://cm:pw@127.0.0.1:5432/cm_test
      REDIS_URL: redis://127.0.0.1:6379/0
      EMAIL_ENCRYPTION_KEY: ci-stack-like-encryption-key
      TRACKING_SECRET: ci-stack-like-tracking-secret
      CHAMPMAIL_API_KEY: ci-stack-like-api-key
      CHAMPMAIL_WEBHOOK_SECRET: ci-stack-like-hook
      INBOXKIT_API_KEY: ci-stack-inboxkit
      INBOXKIT_WORKSPACE_ID: ws_stack
      TEST_IMAP: 127.0.0.1:3143
      TEST_GREENMAIL_SMTP: 127.0.0.1:3025
      TEST_GREENMAIL_API: http://127.0.0.1:8080
      TEST_MAILPIT_SMTP: 127.0.0.1:1025
      TEST_MAILPIT_API: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Wait for GreenMail and Mailpit
        run: |
          for u in http://127.0.0.1:8080/api/service/readiness http://127.0.0.1:8025/readyz; do
            for i in $(seq 60); do curl -fs "$u" >/dev/null && break; sleep 2; done; curl -fs "$u" >/dev/null
          done
      - name: Full suite (warnings are printed, not filtered)
        run: python -m pytest -rsw -p no:cacheprovider --junitxml=junit.xml
      - name: Only the live-compose gates may be skipped here (it runs in the next job)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as T
          sk = sorted(c.get("classname") or c.get("name") for c in T.parse("junit.xml").iter("testcase") if c.find("skipped") is not None)
          print("skipped:", sk)
          assert sk == ["tests.test_m11_gate", "tests.test_m1_gate"], sk
          PY

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: edge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  compose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock .env only (no compose override)
        run: |
          grep -vE '^(CHAMPMAIL_API_KEY|CHAMPMAIL_WEBHOOK_SECRET|EMAIL_ENCRYPTION_KEY|TRACKING_SECRET|INBOXKIT_API_KEY|INBOXKIT_WORKSPACE_ID)=' .env.example > .env
          printf '%s\n' CHAMPMAIL_API_KEY=ci-api-key CHAMPMAIL_WEBHOOK_SECRET=ci-hook INBOXKIT_API_KEY=ci-ik INBOXKIT_WORKSPACE_ID=ws_ci \
            "EMAIL_ENCRYPTION_KEY=$(openssl rand -hex 32)" "TRACKING_SECRET=$(openssl rand -hex 32)" >> .env
      - run: docker compose up --build --wait
      - name: Gate module inside the api container
        run: docker compose exec -T -e M1_GATE=1 api python -m pytest tests/test_m1_gate.py -s -p no:cacheprovider
      - name: M1.1 gate module (canary, seeds, cap-only PATCH) inside the api container
        run: docker compose exec -T -e M1_GATE=1 api python -m pytest tests/test_m11_gate.py -s -p no:cacheprovider
      - if: always()
        run: docker compose ps -a && docker compose logs --no-color worker | tail -50
