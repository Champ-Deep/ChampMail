name: CI

on:
  push:
    branches: [main, v2-consolidation, production-email-engine, simplified]
  pull_request:
    branches: [main, production-email-engine, v2-consolidation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + import smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # tests/api/test_endpoints.py::test_health_check_success asserts the health
    # route returns 200, and that route runs a real "SELECT 1" against Postgres
    # and returns 503 when it fails. The old setup pointed DATABASE_URL at a dead
    # localhost:5432, so that single test failed on every runner while passing on
    # any developer machine that happened to have Postgres. A real service makes
    # the test environment-independent and keeps its assertion honest.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champmail
          POSTGRES_PASSWORD: champmail
          POSTGRES_DB: champmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The app prefers DATABASE_URL over the individual POSTGRES_* settings, and
      # conftest.py only defaults it, so set it explicitly here.
      DATABASE_URL: postgresql+asyncpg://champmail:champmail@localhost:5432/champmail
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: champmail
      POSTGRES_PASSWORD: champmail
      POSTGRES_DB: champmail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # The suite needs no SMTP and no network, but it does need a reachable
      # Postgres for the health-route assertion above. conftest.py still pins
      # REDIS_URL at localhost so an accidental live cache connection fails fast.
      - name: Import every module
        run: python import_smoke.py

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b` runs first as part of the build script, so a type error fails
      # here rather than producing a broken bundle.
      - name: Typecheck and build
        run: npm run build

  mail-engine:
    name: Mail engine (go build/vet/test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mail-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: mail-engine/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Covers the DKIM signer and MIME builder tests added by PR #1.
      - name: Test
        run: go test ./...

  migrations:
    name: Migrations (single alembic head)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The three lineages (pee, PR #1-4, PR #5) each shipped their own
      # 009..015 numbering, which produced multiple alembic heads. This gate
      # fails if that ever happens again.
      - name: Assert exactly one migration head
        env:
          DATABASE_URL: postgresql+asyncpg://unused:unused@localhost:5432/unused
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "heads: $heads"
          test "$heads" -eq 1