# Backend route checks (SUGGESTIONS 1.1/1.2).
# The send-surface consolidation regression test: exactly one POST /api/v1/send
# and every send route behind require_auth.
name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  send-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run send-route regression test
        run: python -m pytest tests/unit/test_send_routes.py -q
