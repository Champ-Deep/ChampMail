# ChampMail Docker Compose Configuration
# Full stack with PostgreSQL, Redis, Backend, Celery, Mail Engine, and ChampGraph integration

services:
  # PostgreSQL Database (User management, Workflows)
  postgres:
    image: postgres:16-alpine
    container_name: champmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-champmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champmail_dev}
      POSTGRES_DB: ${POSTGRES_DB:-champmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-champmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - champmail-network

  # Redis Cache + Celery Broker
  redis:
    image: redis:7-alpine
    container_name: champmail-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - champmail-network

  # ChampMail Mail Engine (Go - forked BillionMail)
  mail-engine:
    build:
      context: ./mail-engine
      dockerfile: Dockerfile
    container_name: champmail-mail
    restart: unless-stopped
    environment:
      SERVER_PORT: "8025"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-champmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champmail_dev}
      POSTGRES_DB: ${POSTGRES_DB:-champmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-champmail}
      DKIM_DOMAIN: ${DKIM_DOMAIN:-champmail.com}
      DAILY_SEND_LIMIT: ${DAILY_SEND_LIMIT:-1000}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-10}
    ports:
      - "8025:8025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - champmail-network

  # OpenDKIM — DKIM signing milter (sits between app and Postfix)
  opendkim:
    build:
      context: ./mail-engine/opendkim
      dockerfile: Dockerfile
    container_name: champmail-opendkim
    restart: unless-stopped
    volumes:
      - opendkim_keys:/etc/opendkim/keys
      - opendkim_config:/etc/opendkim
    networks:
      - champmail-network

  # Postfix — direct delivery MTA (no TurboSMTP relay)
  smtp:
    build:
      context: ./mail-engine/postfix
      dockerfile: Dockerfile
    container_name: champmail-smtp
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.championsmail.com}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-championsmail.com}
      # Leave RELAY_HOST empty for direct delivery; set only if you want a smarthost
      RELAY_HOST: ${SMTP_RELAY_HOST:-}
      RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      RELAY_USER: ${SMTP_RELAY_USER:-}
      RELAY_PASS: ${SMTP_RELAY_PASS:-}
      OPENDKIM_HOST: opendkim
      OPENDKIM_PORT: 8891
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - smtp_data:/var/spool/postfix
      - letsencrypt_certs:/etc/letsencrypt:ro
    depends_on:
      - opendkim
    networks:
      - champmail-network

  # Certbot — Let's Encrypt TLS cert auto-renewal
  certbot:
    image: certbot/certbot:latest
    container_name: champmail-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - champmail-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champmail-backend
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-champmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champmail_dev}
      POSTGRES_DB: ${POSTGRES_DB:-champmail}

      # ChampGraph — accessible via the external graphiti network
      CHAMPGRAPH_URL: http://graphiti-knowledge-graph-champ-graph-1:8080
      CHAMPGRAPH_API_KEY: ${CHAMPGRAPH_API_KEY:-}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-champmail-jwt-secret-dev-key-change-me}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}

      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/1

      MAIL_ENGINE_URL: http://mail-engine:8025

      # ── SMTP — points to local Postfix container (direct delivery) ──────────
      SMTP_HOST: smtp
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"

      # ── Infrastructure ───────────────────────────────────────────────────────
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.championsmail.com}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:-}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-}

      # ── Email compliance ─────────────────────────────────────────────────────
      DMARC_REPORT_EMAIL: ${DMARC_REPORT_EMAIL:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      UNSUBSCRIBE_BASE_URL: ${UNSUBSCRIBE_BASE_URL:-}

      # ── DKIM ─────────────────────────────────────────────────────────────────
      DKIM_SELECTOR: ${DKIM_SELECTOR:-champmail}
      DKIM_KEYS_PATH: /etc/opendkim/keys

      # ── Warmup ───────────────────────────────────────────────────────────────
      WARMUP_SEED_EMAILS: ${WARMUP_SEED_EMAILS:-}

      # ── Seed inbox accounts (pre-campaign placement testing) ─────────────────
      SEED_GMAIL_EMAIL: ${SEED_GMAIL_EMAIL:-}
      SEED_GMAIL_PASSWORD: ${SEED_GMAIL_PASSWORD:-}
      SEED_OUTLOOK_EMAIL: ${SEED_OUTLOOK_EMAIL:-}
      SEED_OUTLOOK_PASSWORD: ${SEED_OUTLOOK_PASSWORD:-}
      SEED_YAHOO_EMAIL: ${SEED_YAHOO_EMAIL:-}
      SEED_YAHOO_PASSWORD: ${SEED_YAHOO_PASSWORD:-}

      # ── Campaign sending ─────────────────────────────────────────────────────
      CAMPAIGN_CADENCE_SECONDS: ${CAMPAIGN_CADENCE_SECONDS:-3600}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
      NAMECHEAP_IP: ${NAMECHEAP_IP:-}

      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}

      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://103.170.162.2:3001}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-https://champiq-production.up.railway.app,http://103.170.162.2:3001,http://localhost:3001,http://localhost:5173}
    volumes:
      - opendkim_keys:/etc/opendkim/keys
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - champmail-network
      - champgraph-network

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champmail-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CHAMPGRAPH_URL: http://graphiti-knowledge-graph-champ-graph-1:8080
      CHAMPGRAPH_API_KEY: ${CHAMPGRAPH_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAIL_ENGINE_URL: http://mail-engine:8025
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-champmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champmail_dev}
      POSTGRES_DB: ${POSTGRES_DB:-champmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      SMTP_HOST: smtp
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"

      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.championsmail.com}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:-}
      UNSUBSCRIBE_BASE_URL: ${UNSUBSCRIBE_BASE_URL:-}

      DKIM_SELECTOR: ${DKIM_SELECTOR:-champmail}
      DKIM_KEYS_PATH: /etc/opendkim/keys

      DMARC_REPORT_EMAIL: ${DMARC_REPORT_EMAIL:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}

      WARMUP_SEED_EMAILS: ${WARMUP_SEED_EMAILS:-}
      SEED_GMAIL_EMAIL: ${SEED_GMAIL_EMAIL:-}
      SEED_GMAIL_PASSWORD: ${SEED_GMAIL_PASSWORD:-}
      SEED_OUTLOOK_EMAIL: ${SEED_OUTLOOK_EMAIL:-}
      SEED_OUTLOOK_PASSWORD: ${SEED_OUTLOOK_PASSWORD:-}
      SEED_YAHOO_EMAIL: ${SEED_YAHOO_EMAIL:-}
      SEED_YAHOO_PASSWORD: ${SEED_YAHOO_PASSWORD:-}

      CAMPAIGN_CADENCE_SECONDS: ${CAMPAIGN_CADENCE_SECONDS:-3600}

      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
      NAMECHEAP_IP: ${NAMECHEAP_IP:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-champmail-jwt-secret-dev-key-change-me}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
    volumes:
      - opendkim_keys:/etc/opendkim/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - champmail-network
      - champgraph-network

  # Celery Beat (Scheduler)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champmail-beat
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q beat"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - champmail-network

  # Flower (Celery monitoring)
  flower:
    image: mher/flower:latest
    container_name: champmail-flower
    restart: unless-stopped
    command: celery --broker=redis://:${REDIS_PASSWORD:-}@redis:6379/0 flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - champmail-network

  # MailHog — local SMTP catcher for testing (no TLS, no auth)
  # Web UI: http://<host>:8026   SMTP: mailhog:1025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: champmail-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8026:8025"   # Web UI (8025 is taken by mail-engine)
    networks:
      - champmail-network

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: champmail-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - champmail-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  smtp_data:
    driver: local
  opendkim_keys:
    driver: local
  opendkim_config:
    driver: local
  letsencrypt_certs:
    driver: local
  certbot_webroot:
    driver: local

networks:
  champmail-network:
    driver: bridge
  # External network to reach the ChampGraph container
  champgraph-network:
    external: true
    name: graphiti-knowledge-graph_default
