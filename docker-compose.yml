x-app: &app
  build: ./backend
  env_file: .env
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    # Up only after `alembic upgrade head` (see Dockerfile CMD), so the worker never ticks on a bare schema.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      retries: 40
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: champmail
      POSTGRES_DB: champmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champmail}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champmail"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    environment:
      # Dev-only: accept any SMTP AUTH so mailboxes (which always authenticate) can send to Mailpit.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
