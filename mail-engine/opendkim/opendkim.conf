## OpenDKIM configuration — multi-domain signing

Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes

Canonicalization        relaxed/simple

# Listen on all interfaces for Postfix milter connections
Socket                  inet:8891@0.0.0.0

PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim

# Multi-domain key and signing tables — appended dynamically by provision_new_domain
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable

# Trust connections from Postfix container and localhost
ExternalIgnoreList      /etc/opendkim/TrustedHosts
InternalHosts           /etc/opendkim/TrustedHosts

Mode                    sv
