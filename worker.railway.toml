# Railway configuration for the ChampMail Celery WORKER service.
#
# Why this file exists
# --------------------
# ChampMail's background work is all Celery (app/celery_app.py registers
# app.tasks.sending / sequences / warmup / domains / bounces / analytics /
# campaign_tasks). Neither backend/railway.toml nor render.yaml defined a worker
# or a beat service, so a cloud deploy ran the API only: it would accept
# campaigns, enqueue tasks, and never send a single email. Nothing errored —
# the queue just grew.
#
# Deploy as a SEPARATE Railway service from the same repo:
#   Root Directory : backend
#   Config Path    : ../worker.railway.toml   (or copy this into backend/)
#
# Share the Postgres and Redis plugins with the API service — the worker must
# see the same broker and the same database.
#
# Memory: Celery workers here are I/O-bound (SMTP + HTTP), not browser-bound,
# so the LakeStream sizing note does not apply. 512MB-1GB is ample at
# --concurrency=4.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# * No `alembic upgrade head` here. Migrations run in exactly one place (the
# * API service's start command); two services racing the same migration on
# * deploy is how you get a half-applied schema and a stuck alembic_version row.
startCommand = "celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default,warmup,sending,sequences"
# Celery workers expose no HTTP surface, so there is nothing to health-check.
# Railway treats the process staying alive as health.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Required — must match the API service exactly:
#   DATABASE_URL           (shared Postgres plugin)
#   REDIS_URL              (shared Redis plugin — this is the Celery broker)
#   JWT_SECRET_KEY
#   EMAIL_ENCRYPTION_KEY   (the worker decrypts mailbox credentials at send time)
#   ENVIRONMENT=production
#
# Required for the InboxKit send path (app/tasks/sending.py::_send_via_inboxkit):
#   INBOXKIT_API_KEY
#   INBOXKIT_WORKSPACE_ID
#
# Optional — enables event egress to the orchestrator. Without CHAMPIQ_URL,
# emit_email_event() is a no-op and sends stay invisible to ChampIQ's bus,
# Cham_Graph and the run ledger (app/services/champiq_emit.py).
#   CHAMPIQ_URL
#   CHAMPIQ_WEBHOOK_SECRET
